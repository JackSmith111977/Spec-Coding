rules:
  - Only documents listed under stages.documents are canonical stage documents for this version.
  - Documents listed under rule_documents are canonical rules and are not counted as canonical stage documents; their actual applicability follows each rule document and current context.
  - Documents listed under exception_workflows.documents are canonical exception workflow documents and are loaded only when their trigger applies.
  - Documents listed under meta_protocols are canonical meta protocol documents and define Spec Coding onboarding, composition, or transformation behavior without becoming workflow stages.
  - Human overview README files and navigation, governance, and reference documents are not counted as canonical stage, rule, exception workflow, or meta protocol documents.
  - Reference documents are non-normative knowledge sources; Environment Discover / Harness Adapt may consume harness_primitives, harness_standards, and coding_agent_runtimes for common capability language, public-standard adoption guidance, runtime architecture guidance, and official source discovery, but current environment capability is resolved from current executable / local / official evidence.
  - Project adoption should follow meta-protocols/project-onboarding.md before target-side Harness compilation when no valid Adoption Baseline exists.
  - Canonical Markdown remains the normative Source of Truth; target-side Harness Compilation consumes a version-bound Semantic IR derived from that Canonical Corpus plus the valid Adoption Baseline.
  - Historical versions are retrieved from Git history; do not keep parallel versioned copies under docs.
  - Add, delete, move, or rename a canonical stage, rule, exception workflow, or meta protocol document only together with a manifest update.
  - Consumers should resolve VERSION and this manifest, load the matching Semantic IR, resolve or validate Project Onboarding, then perform Environment Discover → Harness Adapt → Verify & Accept before entering or resuming Workflow execution.
  - All formal workflows inherit rules/global-contracts.md unless a workflow defines a stricter rule.
  - Human-Agent Collaboration applies to all formal workflows and to Meta Protocol interactions that involve Human intent, authority, or key judgment.
  - Agent Delegation & Coordination applies whenever Main Agent delegates bounded work, independent review, context isolation, or runtime capability/model routing is used; workflows and Meta Protocols reference rather than duplicate its semantics.
  - Core terminology and canonical Chinese explanations follow reference/glossary.md; terminology changes that alter workflow, rule, or meta protocol semantics require semantic version governance.
