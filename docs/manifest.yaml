rules:
  - Only documents listed under stages.documents are canonical stage documents for this version.
  - Documents listed under rule_documents are canonical cross-stage rules and are not counted as canonical stage documents.
  - Documents listed under exception_workflows.documents are canonical exception workflow documents and are loaded only when their trigger applies.
  - Human overview README files and navigation/governance documents are not counted as canonical stage, rule, or exception workflow documents.
  - Harness generation should follow harness-compilation-protocol.md; applicable stage, exception workflow, and rule documents remain the source requirements.
  - Historical versions are retrieved from Git history; do not keep parallel versioned copies under docs.
  - Add, delete, move, or rename a canonical stage, rule, or exception workflow document only together with a manifest update.
  - Consumers should resolve the repository version first, then read this manifest before loading applicable workflow documents and rule documents.
  - All formal workflows inherit global-contracts.md unless a workflow defines a stricter rule.
  - Core terminology and canonical Chinese explanations follow glossary.md; terminology changes that alter workflow or rule semantics require semantic version governance.
