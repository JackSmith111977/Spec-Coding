rules:
  - Only documents listed under stages.documents are canonical stage documents for this version.
  - Human overview README files and navigation/governance documents are not counted as canonical stage documents.
  - Historical versions are retrieved from Git history; do not keep parallel versioned copies under docs.
  - Add, delete, or rename a canonical stage document only together with a manifest update.
  - Consumers should resolve the repository version first, then read this manifest before loading stage documents.
  - All stage documents inherit global-contracts.md unless a stage defines a stricter rule.
  - Core terminology and canonical Chinese explanations follow glossary.md; terminology changes that alter workflow semantics require semantic version governance.
